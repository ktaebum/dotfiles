# seoul dark
[theme.custom]
# Main accent
accent = "#C66D86"

# Background surfaces
panel_bg = "#2E3330"
sidebar_bg = "#272C29"

surface0 = "#4C4C4C"
surface1 = "#545250"
surface_dim = "#212522"

overlay0 = "#545250"
overlay1 = "#555555"

# Focus / selection
active_row_bg = "#545454"
selection_bg = "#545250"

# Text
text = "#DFE0E0"
subtext0 = "#A8A9A6"

# Semantic colors
mauve = "#C66D86"
green = "#9BB8B8"
yellow = "#E5B561"
red = "#A84F4C"
blue = "#688ACB"
teal = "#588383"
peach = "#CE8F6B"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
pane_borders = "auto"
pane_gaps = false
pane_outer_borders = false
show_agent_labels_on_pane_borders = false
mouse_capture = true
prompt_new_tab_name = false
confirm_close = false
agent_panel_scope = "current"

[keys]
prefix = "ctrl+b"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
detach = "prefix+d"
